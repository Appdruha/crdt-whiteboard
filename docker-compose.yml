services:
  postgres:
    image: postgres:16-alpine
    container_name: crdt-demo-postgres
    environment:
      POSTGRES_DB: crdt_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crdt_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crdt-demo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: crdt-demo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: crdt-demo-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PORT: 3001
      PUBLIC_BASE_URL: http://localhost:3001
      DEMO_ROOM_ID: demo-room
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/crdt_demo
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: crdt-demo
      CHUNK_SIZE: 10
      FLUSH_INTERVAL_MS: 1000
      SNAPSHOT_EVERY: 50
    ports:
      - "3001:3001"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: crdt-demo-client
    depends_on:
      server:
        condition: service_started
    environment:
      NODE_ENV: development
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
